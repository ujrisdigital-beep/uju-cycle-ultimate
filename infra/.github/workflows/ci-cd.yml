name: UJU Cycle v4 — CI/CD + Calibration + Security

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  DOCKER_REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: uju
          POSTGRES_PASSWORD: uju_secret
          POSTGRES_DB: uju_cycle
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Install deps
        run: |
          pip install -r backend/requirements.txt
          pip install pytest httpx prometheus-client cryptography boto3
      - name: Run lint
        run: |
          pip install flake8 && flake8 backend/ --max-line-length=120
      - name: Init DB
        run: |
          python -c "from backend.common.database import engine; from backend.common.models import Base; Base.metadata.create_all(bind=engine)"
        env:
          DATABASE_URL: postgresql://uju:uju_secret@localhost:5432/uju_cycle
      - name: Test imports + basic endpoints
        run: |
          python -c "from backend.ingestor.main import app; print('Ingestor OK')"
          python -c "from backend.diviner.main import app; print('Diviner OK')"
          python -c "from backend.lens-shifter.main import app; print('Lens Shifter OK')"
          python -c "from backend.pattern-weaver.main import app; print('Pattern Weaver OK')"
          python -c "from backend.critic.main import app; print('Critic OK')"
          python -c "from backend.explainer.main import app; print('Explainer OK')"
          python -c "from backend.common.encryption import EncryptionManager; print('Encryption OK')"
          python -c "from backend.common.auth import verify_api_key; print('Auth OK')"

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Install & build
        working-directory: frontend
        run: |
          npm install
          npm run build

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

  calibration:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test-backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: uju
          POSTGRES_PASSWORD: uju_secret
          POSTGRES_DB: uju_cycle
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Install deps
        run: |
          pip install -r backend/requirements.txt requests
      - name: Start services
        run: |
          docker-compose -f infra/docker-compose.yml up -d
          sleep 30
      - name: Run Calibration Suite
        run: |
          cd backend/calibration
          python run_calibration.py --dataset calibration_dataset.json --output calibration_report.json
      - name: Upload Calibration Report
        uses: actions/upload-artifact@v4
        with:
          name: calibration-report
          path: backend/calibration/calibration_report.json

  docker-build:
    needs: [test-backend, test-frontend, security-scan]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          file: infra/docker-compose.yml
