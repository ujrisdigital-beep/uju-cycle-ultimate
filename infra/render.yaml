services:
  - type: web
    name: uju-backend
    env: docker
    plan: starter
    numInstances: 1
    healthCheckPath: /health
    envVars:
      - key: OLLAMA_HOST
        value: http://ollama:11434
      - key: DATABASE_URL
        fromDatabase:
          name: uju-db
          property: connectionString
      - key: REDIS_URL
        value: redis://redis:6379

databases:
  - name: uju-db
    databaseName: uju_cycle
    user: uju
    plan: free

  - name: uju-redis
    plan: free
