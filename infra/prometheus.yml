global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'uju-ingestor'
    static_configs:
      - targets: ['ingestor:8000']
  
  - job_name: 'uju-diviner'
    static_configs:
      - targets: ['diviner:8001']
  
  - job_name: 'uju-lens-shifter'
    static_configs:
      - targets: ['lens-shifter:8002']
  
  - job_name: 'uju-pattern-weaver'
    static_configs:
      - targets: ['pattern-weaver:8003']
  
  - job_name: 'uju-critic'
    static_configs:
      - targets: ['critic:8004']
  
  - job_name: 'uju-explainer'
    static_configs:
      - targets: ['explainer:8005']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
